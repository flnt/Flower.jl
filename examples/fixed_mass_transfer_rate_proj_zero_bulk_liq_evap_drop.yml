        plot_normal_macro: |
          global normal_x_2,normal_y_2
          # normal_x_2 = file['normal_x'][:]
          # normal_y_2 = file['normal_y'][:]

          # normal_x_2.fill(1)
          # normal_y_2.fill(0)

          phi = data

          dx = x_1D[4] - x_1D[3]
          dy = y_1D[4] - y_1D[3]

          # Compute the gradient (normal vectors) using finite differences
          phi_x = np.gradient(phi, dx, axis=0)
          phi_y = np.gradient(phi, dy, axis=1)

          # Normalize the gradient to get the normal vectors
          norm = np.sqrt(phi_x**2 + phi_y**2 + 1e-10)
          phi_x /= norm
          phi_x /= norm

          normal_x_2 = phi_x
          normal_y_2 = phi_y

