  macro_data: |
    global varx_2,vary_2,values
    import glob

    print(colored('default macro data','red'))
    
    # time_list =[]

    # radius_list=[]

    values = {}

    for var_list in figpar['var']:
      # print('var_list',var_list)
      for var in var_list:
        values[var] = []

    # for files in h5_files:
    files = h5_files[figpar['iter']]

    files = glob.glob(files)

    files = sorted(files)

    # print('h5_files',h5_files)

    # print(files)

    for file_name in files:
  
      with h5py.File(file_name, "r") as file:
        # print('file',file_name)
        # print(file.keys())

        try:
          # read nstep (adapt path if needed)
          nstep = file["nstep"][()]   # or file["/solver/nstep"][()]
        except:
          print('nstep not saved in file ',file_name)
          continue
        # ---- selection rule ----
        if nstep == 0: # or nstep % 20 != 0:
          continue   # skip this file

        for var_list in figpar['var']:

          tmp_values = {}
          missing = False

          # try to read all variables of the group
          for var in var_list:
            try:
              tmp_values[var] = file[var][()]
            except KeyError:
              print(colored(var + ' not saved in ' + file_name, 'red'))
              missing = True
              break

          # only save if ALL variables were found
          if not missing:
            for var, value in tmp_values.items():
              values[var].append(value)

        # save mesh size (independent variables)
        if 'nx' in file:
          values['nx'] = file['nx'][()]
          # print('file ',file['nx'][()], ' file ',file_name)
        if 'ny' in file:
          values['ny'] = file['ny'][()]
        

    
    # print(values)
    varx_2 = values[figpar['var'][0][0]]
    vary_2 = values[figpar['var'][0][1]]
    varx_2 = np.asarray(varx_2)
    vary_2 = np.asarray(vary_2)

    # nx = file['nx'][()]
    # ny = file['ny'][()] 

