    normal_v: { size: [ '$nx', '$ny+1' ], type: array, subtype: double }
  

    #interpolated
    advection_velocity_x: { size: [ '$nx', '$ny' ], type: array, subtype: double }
    advection_velocity_y: { size: [ '$nx', '$ny' ], type: array, subtype: double }

